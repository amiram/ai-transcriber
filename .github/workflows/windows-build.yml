name: Windows Build and Release

on:
  push:
    branches: [ main ]
    tags: ['*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Install whisper and CPU PyTorch so PyInstaller can bundle them into the exe
          python -m pip install -U openai-whisper
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyinstaller==5.11.0

      - name: Build executable with PyInstaller
        run: |
          .\scripts\build_windows.ps1 -PythonExe python
        shell: pwsh

      - name: Ensure dist\Transcriber.exe exists
        shell: pwsh
        run: |
          Write-Host "Ensuring dist\\Transcriber.exe exists (searching recursively)..."
          $dist = Join-Path (Get-Location) 'dist'
          if (-not (Test-Path $dist)) {
            Write-Host "dist directory not found; skipping copy"
            exit 0
          }
          $found = Get-ChildItem -Path $dist -Recurse -Filter '*.exe' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -ne $found) {
            $dest = Join-Path $dist 'Transcriber.exe'
            if ($found.FullName -ne $dest) {
              Copy-Item -Path $found.FullName -Destination $dest -Force
              Write-Host "Copied $($found.FullName) -> $dest"
            } else {
              Write-Host "Transcriber.exe already present at $dest"
            }
          } else {
            Write-Host "No executable found under $dist"
          }

      - name: Show dist/ contents for debugging
        run: |
          dir .\dist\ /s
        shell: cmd

      - name: Verify dist\Transcriber.exe and emit diagnostics if missing
        shell: pwsh
        run: |
          $expected = Join-Path (Get-Location) 'dist\Transcriber.exe'
          if (Test-Path $expected) {
            Write-Host "Found expected executable: $expected"
            exit 0
          }

          Write-Host "ERROR: Expected exe not found at $expected"
          Write-Host "--- PyInstaller log (last 200 lines) ---"
          if (Test-Path pyinstaller_build.log) { Get-Content pyinstaller_build.log -Tail 200 } else { Write-Host "pyinstaller_build.log not found" }

          Write-Host "--- dist directory listing ---"
          if (Test-Path (Join-Path (Get-Location) 'dist')) { Get-ChildItem -Path 'dist' -Recurse -Force | Format-Table -AutoSize } else { Write-Host "dist directory not present" }

          Write-Host "--- installer\Output directory listing ---"
          if (Test-Path (Join-Path (Get-Location) 'installer\Output')) { Get-ChildItem -Path 'installer\Output' -Recurse -Force | Format-Table -AutoSize } else { Write-Host "installer\Output directory not present" }

          # Create diagnostics zip for upload
          $diagTmp = Join-Path $env:TEMP ([System.Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $diagTmp | Out-Null
          if (Test-Path pyinstaller_build.log) { Copy-Item -Path pyinstaller_build.log -Destination $diagTmp -Force }
          if (Test-Path 'dist') { Copy-Item -Path 'dist' -Destination $diagTmp -Recurse -Force }
          if (Test-Path 'build') { Copy-Item -Path 'build' -Destination $diagTmp -Recurse -Force }
          if (Test-Path 'installer\Output') { Copy-Item -Path 'installer\Output' -Destination $diagTmp -Recurse -Force }
          $diagName = 'ci-diagnostics.zip'
          if (Test-Path $diagName) { Remove-Item $diagName -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($diagTmp, $diagName)
          Write-Host "Created diagnostic ZIP: $diagName"

          # Cleanup temp
          Remove-Item -Recurse -Force $diagTmp

          # Exit with error so CI marks the job failed and we can inspect the uploaded artifact
          exit 1

      - name: Upload PyInstaller log and build folder (diagnostics)
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-diagnostics
          path: |
            pyinstaller_build.log
            build/**
            dist/**

      - name: Package portable ZIP
        run: |
          pwsh .\scripts\package_portable.ps1 -ExeName "Transcriber.exe" -DistDir "dist" -OutZip "Transcriber_portable.zip"
        shell: pwsh

      - name: Compile Inno Setup installer
        run: |
          Write-Host "Determining version to pass to ISCC..."
          if ($env:GITHUB_REF -and $env:GITHUB_REF.StartsWith('refs/tags/')) {
            $version = $env:GITHUB_REF.Substring(10)
          } else {
            $version = '1.0'
          }
          Write-Host "Using version: $version"
          $isccPath = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          Write-Host "Running: $isccPath /DMyAppVersion=$version installer\\transcriber.iss"
          & "$isccPath" "/DMyAppVersion=$version" "installer\\transcriber.iss"
        shell: pwsh

      - name: Collect installer executable into a stable path
        shell: pwsh
        run: |
          Write-Host "Looking for any .exe files under installer\Output and copying the newest one to ./TranscriberSetup.exe"
          $out = Get-ChildItem -Path 'installer\Output' -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -ne $out) {
            Copy-Item -Path $out.FullName -Destination (Join-Path (Get-Location) 'TranscriberSetup.exe') -Force
            Write-Host "Copied installer: $($out.FullName) -> TranscriberSetup.exe"
          } else {
            Write-Host 'No installer executable found under installer\Output'
            exit 0
          }

      - name: Verify expected artifacts exist (dist & installer)
        run: |
          echo "Checking for dist\Transcriber.exe"
          if exist dist\Transcriber.exe (echo "FOUND dist\Transcriber.exe") else echo "MISSING dist\Transcriber.exe"
          echo "Checking for installer TranscriberSetup.exe in repo root"
          if exist TranscriberSetup.exe (echo "FOUND TranscriberSetup.exe") else echo "MISSING TranscriberSetup.exe"
        shell: cmd

      - name: Create GitHub Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist\Transcriber.exe
            Transcriber_portable.zip
            TranscriberSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Upload release assets (fallback)
        if: steps.create_release.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-artifacts
          path: |
            dist\Transcriber.exe
            Transcriber_portable.zip
            TranscriberSetup.exe
